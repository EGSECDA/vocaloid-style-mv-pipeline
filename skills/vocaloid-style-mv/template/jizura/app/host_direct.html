<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JIZURA compositor prototype (direct)</title>
<!-- Prototype of OUR compositor embedding JIZURA by loading its script bundle into the same page.
     Layer sandwich per frame (all at 1920x1080, all pure functions of t):
       1. our background   (stand-in for the illustrated / Blender dusk plate)
       2. JIZURA 'back'    (its background graphic + decorations that sit behind the lyric)
       3. our character    (stand-in for the tegaki character, kept in the centre: project.centerFree = true)
       4. JIZURA 'front'   (lyric, front decorations, chromatic ghosts, morph, HUD, screen FX fenced to content)
       5. our grade        (vignette / warm grade)
     API: window.HOST.init(project, {audioUrl}) ; window.HOST.compose(t) -> {ms, jz, total} ; the canvas is #comp. -->
<style>html,body{margin:0;background:#111} canvas{display:block;max-width:100vw;height:auto}</style>
</head>
<body>
<canvas id="comp" width="1920" height="1080"></canvas>
<script src="jizura_engine.js"></script>
<script src="jizura_adapter.js"></script>
<script>
(() => {
  const comp = document.getElementById('comp'), cx = comp.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = comp.width; c.height = comp.height; return c; };
  const L = { back: mk(), front: mk() };
  // ---- our own layers (placeholders for the real illustrated / 3D layers) ----
  function ourBackground(ctx, t, W, H) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1d1238'); g.addColorStop(0.55, '#7a2f5a'); g.addColorStop(0.8, '#e0703a'); g.addColorStop(1, '#f6c177');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const sy = H * (0.78 + 0.02 * Math.sin(t * 0.3));                         // the setting sun, sinking slowly
    const r = ctx.createRadialGradient(W / 2, sy, 0, W / 2, sy, H * 0.45);
    r.addColorStop(0, 'rgba(255,236,190,0.95)'); r.addColorStop(0.18, 'rgba(255,190,120,0.55)'); r.addColorStop(1, 'rgba(255,120,80,0)');
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  }
  function ourCharacter(ctx, t, W, H) {                                        // silhouette stand-in in the free centre
    ctx.save(); ctx.translate(W / 2, H * 0.62 + Math.sin(t * 1.7) * 6);
    ctx.fillStyle = '#140b1c';
    ctx.beginPath(); ctx.arc(0, -250, 95, 0, Math.PI * 2); ctx.fill();          // head
    ctx.beginPath(); ctx.moveTo(-60, -170); ctx.quadraticCurveTo(-190, 120, -230, 460); ctx.lineTo(230, 460); ctx.quadraticCurveTo(190, 120, 60, -170); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,120,0.8)'; ctx.lineWidth = 4;                // rim light
    ctx.beginPath(); ctx.arc(0, -250, 97, -2.6, -0.4); ctx.stroke();
    ctx.restore();
  }
  function ourGrade(ctx, W, H) {
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,0,20,0.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  window.HOST = {
    async init(project, { audioUrl, beats } = {}) {
      if (beats) JZ.setAudio(beats); else if (audioUrl) await JZ.analyzeAudioUrl(audioUrl);
      return JZ.setProject(project);
    },
    compose(t) {
      const W = comp.width, H = comp.height, t0 = performance.now();
      ourBackground(cx, t, W, H);
      const j0 = performance.now();
      JZ.drawInto(L.back.getContext('2d'), t, 'back');
      JZ.drawInto(L.front.getContext('2d'), t, 'front');
      const jz = performance.now() - j0;
      cx.drawImage(L.back, 0, 0);
      ourCharacter(cx, t, W, H);
      cx.drawImage(L.front, 0, 0);
      ourGrade(cx, W, H);
      return { jz, total: performance.now() - t0 };
    },
    canvas: comp,
  };
  window.HOST_READY = true;
})();
</script>
</body>
</html>
